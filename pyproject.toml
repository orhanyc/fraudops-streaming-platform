[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fraudops-streaming-platform"
version = "0.1.0"
description = "Reproducible streaming fraud detection and analyst evidence platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Orhan Cinar" }]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "joblib>=1.4,<2",
  "kafka-python-ng>=2.2,<3",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "prometheus-client>=0.21,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.8,<3",
  "scikit-learn>=1.6,<2",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13,<2",
  "pandas-stubs>=2.2,<3",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.8,<1",
]

[project.scripts]
fraudops = "fraudops.cli:main"
fraudops-worker = "fraudops.worker:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --cov=fraudops --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["fraudops"]
ignore_missing_imports = true

