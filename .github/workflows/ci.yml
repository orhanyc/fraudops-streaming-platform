name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/check_text.py
      - run: ruff check .
      - run: mypy src
      - run: pytest
      - run: docker compose config --quiet
      - run: docker build -t fraudops-streaming-platform:ci .
      - uses: gitleaks/gitleaks-action@v2

