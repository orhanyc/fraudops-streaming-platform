services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.18
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fraudops
      POSTGRES_USER: fraudops
      POSTGRES_PASSWORD: fraudops-local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraudops"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      FRAUDOPS_MODEL_PATH: /app/artifacts/model.joblib
      FRAUDOPS_DATABASE_URL: postgresql+psycopg://fraudops:fraudops-local@postgres:5432/fraudops
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: .
    command: ["fraudops-worker"]
    environment:
      FRAUDOPS_MODEL_PATH: /app/artifacts/model.joblib
      FRAUDOPS_DATABASE_URL: postgresql+psycopg://fraudops:fraudops-local@postgres:5432/fraudops
      FRAUDOPS_KAFKA_BOOTSTRAP: redpanda:9092
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_started

  generator:
    build: .
    command:
      - fraudops
      - publish
      - --bootstrap-servers
      - redpanda:9092
      - --events
      - "5000"
    depends_on:
      redpanda:
        condition: service_started

